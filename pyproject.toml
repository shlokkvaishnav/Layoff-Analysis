[project]
name = "layoff-pulse"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "feedparser==6.0.14",
    "lxml==6.1.1",
    "pandas==2.3.3",
    "numpy==2.4.6",
    "rapidfuzz==3.14.5",
    "plotly==6.8.0",
    "statsmodels==0.14.6",
    "python-dotenv==1.2.2",
    "playwright==1.60.0",  # only scrape_layoffsfyi_airtable()'s shared-view path needs a browser; run `playwright install chromium` once
    "fastapi==0.139.0",
    "uvicorn[standard]==0.49.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.1.0",
    "ruff==0.16.1",
    "httpx2",  # required by fastapi.testclient.TestClient
]

[tool.uv]
# This repo isn't an installable Python package -- scraper/pipeline/backend
# import each other via sys.path, not as a distributed package. uv should
# just manage the dependency set, not try to build/install this repo itself.
package = false
