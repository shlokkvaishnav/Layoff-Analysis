name: Keep Backend Alive

# Render's free tier sleeps a service after ~15 min idle, costing the next
# real visitor a ~30-60s cold start. Pinging the health endpoint on an
# interval shorter than that keeps it warm continuously.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -fsS --max-time 60 https://layoff-pulse-backend.onrender.com/api/meta/health
